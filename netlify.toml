# Skip Netlify builds when only README.md changed.
# Netlify skips the build only when this command exits 0.
# CRITICAL: when there is no build cache, Netlify sets CACHED_COMMIT_REF equal
# to COMMIT_REF — then any git-diff-based rule sees an empty diff, exits 0, and
# the build is skipped; skipped builds never write a cache, so every later
# build skips too. Guard: if the refs are identical, always BUILD.
[build]
  ignore = "test -n \"$CACHED_COMMIT_REF\" && test \"$CACHED_COMMIT_REF\" != \"$COMMIT_REF\" && git diff --quiet \"$CACHED_COMMIT_REF\" \"$COMMIT_REF\" -- . ':!README.md'"
