title: DOPPIE Project
description: Due luoghi. Due artisti. Due storie.
url: ""
baseurl: ""

collections:
  team:
    output: false
  mostre:
    output: false
  testi:
    output: false

defaults:
  - scope: { path: "", type: team }
    values: { layout: null }
  - scope: { path: "", type: mostre }
    values: { layout: null }
  - scope: { path: "", type: testi }
    values: { layout: null }

plugins:
  - jekyll-seo-tag

# Jekyll skips files starting with "_" by default; CMS uploads sometimes have
# them (e.g. _dsc0283.jpg). Publish them anyway.
include:
  - images/uploads/_*

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - node_modules
  - vendor
  - .sass-cache
  - .jekyll-cache
  - preview.html
